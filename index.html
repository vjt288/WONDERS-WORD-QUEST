function wwqSpeak(text,lang,rate,pitch=1){
  if(!('speechSynthesis'in window)||document.hidden||wwqBackgroundSuspended)return;

  // R61: prioritize speech, including on iOS where per-element volume may be ignored.
  wwqSpeechActive=true;

    const resume=wwqSpeechResumeBgm;wwqSpeechResumeBgm=false;
    if(resume&&wwqBgm&&wwqBgmKey&&!document.hidden&&!wwqBackgroundSuspended){
      wwqBgm.volume=WWQ_BGM_NORMAL_VOLUME;wwqBgm.play().catch(()=>{});

  };
  u.onstart=()=>{if(token===wwqSpeechToken&&wwqSpeechActive)wwqPauseMusicForSpeech()};

    if(speechSynthesis.speaking||speechSynthesis.pending){wwqSpeechSafetyTimer=setTimeout(checkFinished,1000);return;}

/* R60 iPhone/PWA lifecycle audio guard */
let wwqBackgroundSuspended=false;
let wwqBackgroundResumeBgm=false;
const wwqBackgroundVideos=new Set();

function wwqSuspendMediaForBackground(){
  if(wwqBackgroundSuspended)return;
  wwqBackgroundSuspended=true;
  wwqBackgroundResumeBgm=Boolean(wwqBgm&&wwqBgmKey&&(!wwqBgm.paused||wwqSpeechResumeBgm));
  wwqSpeechActive=false;wwqSpeechResumeBgm=false;

  cancelAnimationFrame(wwqBgmFadeRaf);
  wwqBgmFadeRaf=0;

  for(const player of wwqBgmPlayers.values()){
    try{player.pause()}catch(_){}
  }
  for(const pool of wwqSfxPlayers.values()){
    for(const player of pool){
      try{player.pause();player.currentTime=0}catch(_){}
    }
  }

  ++wwqSpeechToken;
  clearTimeout(wwqSpeechSafetyTimer);
  if('speechSynthesis' in window){
    try{speechSynthesis.cancel()}catch(_){}
  }

  document.querySelectorAll('#game video').forEach(video=>{
    if(!video.paused&&!video.ended){
      wwqBackgroundVideos.add(video);
      try{video.pause()}catch(_){}
    }
  });
}

function wwqResumeMediaFromBackground(){
  if(!wwqBackgroundSuspended||document.hidden)return;
  wwqBackgroundSuspended=false;

  const resumeBgm=wwqBackgroundResumeBgm;
  wwqBackgroundResumeBgm=false;
  if(resumeBgm&&wwqBgm&&wwqBgmKey){
    wwqBgm.volume=WWQ_BGM_NORMAL_VOLUME;
    wwqBgm.play().catch(()=>{});
  }

  for(const video of wwqBackgroundVideos){
    if(!video.isConnected)continue;
    video.play().catch(()=>{
      const gate=document.getElementById(video.id==='wwqOpening'?'wwqSoundGate':'wwqEndingGate');
      if(gate){gate.hidden=false;gate.style.display='block';}
    });
  }
  wwqBackgroundVideos.clear();
}

function wwqSfx(key){

    if(!wwqSfxPlayers.has(key))wwqSfxPlayers.set(key,[]);
    const pool=wwqSfxPlayers.get(key);
    let a=pool.find(player=>player.paused||player.ended);
    if(!a&&pool.length<2){a=new Audio(src);pool.push(a);}

    a.volume=.65;
    a.play().catch(()=>{});
  }catch(e){}
}

function makeMeaningDistractors(w){
  const correct=CH[currentCh].words.find(entry=>entry[0]===w)?.[1];
  const curated=WWQ_MEANING_DISTRACTORS[w]||[];
  const candidates=curated.length?curated:CH[currentCh].words.filter(entry=>entry[0]!==w).map(entry=>entry[1]);
  return shuffle([...new Set(candidates.filter(value=>value&&value!==correct))]).slice(0,3);
}
function sim(a,b){const A=a.replace(/[^a-z]/gi,'').toLowerCase(),B=b.replace(/[^a-z]/gi,'').toLowerCase();let same=0;for(let i=0;i<Math.min(A.length,B.length);i++)if(A[i]===B[i])same++;return Math.abs(A.length-B.length)*2 - same}

function wwqLearningLoad(){
  try{const value=JSON.parse(localStorage.getItem(WWQ_LEARNING_KEY)||'null');if(value?.version===1&&value.players&&typeof value.players==='object')wwqLearningStore=value;}catch(e){}
}
function wwqLearningSave(){try{localStorage.setItem(WWQ_LEARNING_KEY,JSON.stringify(wwqLearningStore))}catch(e){}}
function wwqLearningPlayerKey(){return 'p:'+JSON.stringify([(playerName||'').trim()||'訪客',you]);}
function wwqLearningPlayer(){
  const key=wwqLearningPlayerKey();
  if(!wwqLearningStore.players[key])wwqLearningStore.players[key]={name:(playerName||'').trim()||'訪客',role:you,words:{}};
  return wwqLearningStore.players[key];
}
function wwqLearningWord(word){return wwqLearningPlayer().words[word]||{found:false,correct:0,wrong:0,review:false,mastered:false};}
function wwqLearningFound(word){
  if(!WWQ_TREASURE_WORDS.some(entry=>entry.word===word))return;
  const player=wwqLearningPlayer(),record=wwqLearningWord(word);
  if(!record.found){player.words[word]={...record,found:true};wwqLearningSave();}
}
function wwqLearningQuestion(word){
  wwqLearningFound(word);
  wwqLearningActiveQuestion={word,playerKey:wwqLearningPlayerKey(),answered:false};
}
function wwqLearningAnswer(ok){
  const question=wwqLearningActiveQuestion;
  if(!question||question.answered||question.playerKey!==wwqLearningPlayerKey())return;
  if(!WWQ_TREASURE_WORDS.some(entry=>entry.word===question.word))return;
  question.answered=true;
  const player=wwqLearningPlayer(),record=wwqLearningWord(question.word);
  player.words[question.word]={...record,found:true,correct:record.correct+(ok?1:0),wrong:record.wrong+(ok?0:1),review:record.review||!ok,lastAnswered:Date.now()};
  // MASTERED is deliberately not inferred: its criteria have not been approved.
  wwqLearningSave();
}
function wwqLearningStatusHtml(word){
  const r=wwqLearningWord(word);
  return [['FOUND',r.found,'已遇見'],['LEARNED',r.correct>0,'已答對'],['MASTERED',r.mastered,'熟練規則待設定'],['REVIEW',r.review,'待複習']].map(([label,active,title])=>`<span class="${active?'is-active':''}" title="${title}">${label}</span>`).join('');
}
function wwqLearningReviewDone(){
  const entry=WWQ_TREASURE_WORDS[wwqTreasureState.selected];if(!entry)return;
  const record=wwqLearningWord(entry.word);
  wwqLearningPlayer().words[entry.word]={...record,review:false};wwqLearningSave();wwqTreasureRefresh();
}
function wwqLearningSummary(chapter=0){
  const words=WWQ_TREASURE_WORDS.filter(entry=>!chapter||entry.chapter===chapter);
  return words.reduce((sum,entry)=>{const r=wwqLearningWord(entry.word);sum.found+=Number(r.found);sum.learned+=Number(r.correct>0);sum.mastered+=Number(r.mastered);sum.review+=Number(r.review);sum.correct+=r.correct;sum.wrong+=r.wrong;return sum;},{total:words.length,found:0,learned:0,mastered:0,review:0,correct:0,wrong:0});
}

// R50: preserve game coordinates; fit a 16:9 canvas inside the usable viewport.
let wwqResponsiveBlocked=false,wwqDelayedSequence=0;
const wwqDelayedTasks=new Map(),wwqPausedVideos=new Set();
function wwqGameDelay(callback,delay){
  const task={id:++wwqDelayedSequence,callback,remaining:Math.max(0,delay),started:0,handle:null};
  wwqDelayedTasks.set(task.id,task);wwqArmGameDelay(task);return task;
}
function wwqArmGameDelay(task){
  if(wwqResponsiveBlocked||!wwqDelayedTasks.has(task.id))return;
  task.started=performance.now();
  task.handle=setTimeout(()=>{
    task.handle=null;task.remaining=0;
    if(wwqResponsiveBlocked)return;
    wwqDelayedTasks.delete(task.id);task.callback();
  },task.remaining);
}
function wwqClearGameDelay(task){
  if(!task)return;
  if(typeof task==='object'&&'id' in task){clearTimeout(task.handle);wwqDelayedTasks.delete(task.id);}
  else clearTimeout(task);
}
function wwqPauseGameDelays(){
  for(const task of wwqDelayedTasks.values())if(task.handle!==null){clearTimeout(task.handle);task.remaining=Math.max(0,task.remaining-(performance.now()-task.started));task.handle=null;}
}
function wwqResumeGameDelays(){for(const task of wwqDelayedTasks.values())if(task.handle===null)wwqArmGameDelay(task);}
function wwqIsPortrait(){
  const coarse=window.matchMedia?.('(pointer: coarse)').matches;
  // A phone's soft keyboard may change viewport shape without rotating the device.
  if(coarse){
    const type=window.screen?.orientation?.type;
    if(type?.startsWith('portrait'))return true;
    if(type?.startsWith('landscape'))return false;
    if(typeof window.orientation==='number')return Math.abs(window.orientation)!==90;
  }
  return window.innerHeight>window.innerWidth;
}
function wwqResponsiveUpdate(){
  const viewport=window.visualViewport,width=viewport?.width||window.innerWidth,height=viewport?.height||window.innerHeight;
  const probe=document.getElementById('wwqSafeAreaProbe'),computed=probe?getComputedStyle(probe):null;
  const inset=side=>computed?parseFloat(computed['padding'+side])||0:0;
  const top=inset('Top'),right=inset('Right'),bottom=inset('Bottom'),left=inset('Left');
  const canvasWidth=Math.max(1,Math.min(width-left-right,(height-top-bottom)*16/9));
  const style=document.documentElement.style;
  for(const [name,value] of Object.entries({ViewportWidth:width,ViewportHeight:height,CanvasWidth:canvasWidth,CanvasHeight:canvasWidth*9/16,SafeTop:top,SafeRight:right,SafeBottom:bottom,SafeLeft:left}))style.setProperty('--wwq'+name,value+'px');
  style.setProperty('--wwqTextScale',String(Math.min(1,canvasWidth/1366)));
  const blocked=wwqIsPortrait(),changed=blocked!==wwqResponsiveBlocked;
  wwqResponsiveBlocked=blocked;document.body.classList.toggle('wwqPortraitMode',blocked);G.inert=blocked;
  const gate=document.getElementById('wwqRotate');if(gate){gate.hidden=!blocked;gate.setAttribute('aria-hidden',String(!blocked));}
  if(!changed)return;
  if(blocked){
    wwqPauseGameDelays();
    document.querySelectorAll('#game video').forEach(video=>{if(!video.paused&&!video.ended){wwqPausedVideos.add(video);video.pause();}});
  }else{
    wwqResumeGameDelays();
    for(const video of wwqPausedVideos){if(video.isConnected)video.play().catch(()=>{const tap=document.getElementById(video.id==='wwqOpening'?'wwqSoundGate':'wwqEndingGate');if(tap){tap.hidden=false;tap.style.display='block';}});}
    wwqPausedVideos.clear();
  }
}
function wwqInstallResponsive(){
  const probe=document.createElement('div');probe.id='wwqSafeAreaProbe';probe.setAttribute('aria-hidden','true');document.body.appendChild(probe);
  let gate=document.getElementById('wwqRotate');
  if(!gate){gate=document.createElement('div');gate.id='wwqRotate';document.body.appendChild(gate);}
  gate.setAttribute('role','status');gate.setAttribute('aria-live','polite');
  gate.innerHTML='<span class="wwqRotateDevice" aria-hidden="true">↻</span><strong>請將裝置轉為橫向</strong><span>WONDERS WORD QUEST · 16:9</span><small>轉回橫向即可繼續，計時與作答已暫停。<br>ROTATE YOUR DEVICE TO CONTINUE</small>';
  document.addEventListener('click',event=>{if(wwqResponsiveBlocked&&G.contains(event.target)){event.preventDefault();event.stopImmediatePropagation();}},true);
  window.addEventListener('resize',wwqResponsiveUpdate);window.addEventListener('orientationchange',wwqResponsiveUpdate);
  window.screen?.orientation?.addEventListener('change',wwqResponsiveUpdate);
  window.visualViewport?.addEventListener('resize',wwqResponsiveUpdate);
  document.addEventListener('fullscreenchange',wwqResponsiveUpdate);
  document.addEventListener('webkitfullscreenchange',wwqResponsiveUpdate);
  wwqInstallCanvasTypography();wwqInstallDisplayMode();
  wwqResponsiveUpdate();
}

// Scale all game typography against the actual fitted canvas, not browser width.
function wwqCanvasFontValue(value){
  return value.replace(/clamp\(\s*[\d.]+px\s*,\s*([^,]+),\s*([\d.]+px)\s*\)/g,'min($1,$2)')
    .replace(/([\d.]+)vw\b/g,(_,n)=>'calc(var(--wwqCanvasWidth) * '+(Number(n)/100)+')')
    .replace(/([\d.]+)px\b/g,(_,n)=>'calc('+n+'px * var(--wwqTextScale))');
}
function wwqInstallCanvasTypography(){
  const convert=style=>{
    for(const property of ['font','font-size','line-height','letter-spacing','word-spacing']){
      const original=style.getPropertyValue(property);
      if(!original||original.includes('--wwqTextScale')||original.includes('--wwqCanvasWidth'))continue;
      const revised=wwqCanvasFontValue(original);
      if(revised!==original)style.setProperty(property,revised,style.getPropertyPriority(property));
    }
  };
  const visit=rules=>{for(const rule of rules){if(rule.style&&!rule.selectorText?.startsWith('#wwqDisplay'))convert(rule.style);if(rule.cssRules)visit(rule.cssRules);}};
  for(const sheet of document.styleSheets){try{visit(sheet.cssRules);}catch(_){}}
  const scan=node=>{if(node.nodeType!==1)return;if(node.hasAttribute('style'))convert(node.style);node.querySelectorAll('[style]').forEach(el=>convert(el.style));};
  scan(G);
  new MutationObserver(records=>{for(const record of records){if(record.type==='attributes'){if(/font|line-height|letter-spacing|word-spacing/.test(record.target.getAttribute('style')||''))convert(record.target.style);}else record.addedNodes.forEach(scan);}}).observe(G,{subtree:true,childList:true,attributes:true,attributeFilter:['style']});
}
function wwqInstallDisplayMode(){
  const standalone=window.navigator.standalone||window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches;
  const capable=Boolean(document.fullscreenEnabled||document.webkitFullscreenEnabled);
  const button=document.createElement('button');button.id='wwqDisplayButton';button.type='button';button.textContent=capable?'全螢幕':'全螢幕使用方式';button.hidden=Boolean(standalone);document.body.appendChild(button);
  const help=document.createElement('div');help.id='wwqDisplayHelp';help.hidden=true;help.setAttribute('role','dialog');help.setAttribute('aria-modal','true');help.setAttribute('aria-label','全螢幕使用方式');
  help.innerHTML='<div>iPhone／iPad 請在 Safari 點「分享」→「加入主畫面」，再從主畫面的 WONDERS 圖示開啟，即可使用沒有網址列與分頁列的遊戲視窗。<br><button type="button">了解</button></div>';document.body.appendChild(help);
  help.querySelector('button').onclick=()=>{help.hidden=true;button.focus();};
  button.onclick=async()=>{
    if(!capable){help.hidden=false;help.querySelector('button').focus();return;}
    try{if(document.fullscreenElement||document.webkitFullscreenElement){await (document.exitFullscreen?.()??document.webkitExitFullscreen?.());}else{const root=document.documentElement;await (root.requestFullscreen?root.requestFullscreen():root.webkitRequestFullscreen());}wwqResponsiveUpdate();}catch(_){help.hidden=false;help.querySelector('button').focus();}
  };
}

let wwqStoryTasks=[];
function wwqClearStoryTasks(){wwqStoryTasks.forEach(wwqClearGameDelay);wwqStoryTasks=[];}
function bootStory(){
  wwqClearStoryTasks();wwqPrepareVideo();
  G.innerHTML=`<div class="wwqOfficial"><div class="wwqFrame wwqStoryStage" id="wwqStoryStage" aria-label="冒險故事引言">

      <span class="wwqStoryLine" aria-hidden="true">維多利亞學院珍藏著一本神奇的《WONDERS》之書</span>
      <span class="wwqStoryLine" aria-hidden="true">書中的單字，連結著六個奇妙的世界。</span>
      <span class="wwqStoryLine paragraph" aria-hidden="true">某天，書中的魔法失控，化身為單字怪獸，讓六個世界陷入混亂。</span>
      <span class="wwqStoryLine paragraph" aria-hidden="true">現在，你將和夥伴一起出發，學習單字、通過挑戰，逐步找回單字的力量。</span>
      <span class="wwqStoryLine paragraph" aria-hidden="true">最後，前往最終城堡，擊敗單字怪獸，讓校園恢復平靜！</span>
    </div>
    <button class="wwqStoryButton" id="wwqStoryBegin" disabled onclick="wwqBeginOpening()">展開冒險&gt;&gt;</button>
  </div></div>`;
  const stage=document.getElementById('wwqStoryStage');
  const reveal=()=>{
    if(document.getElementById('wwqStoryStage')!==stage)return;
    const lines=stage.querySelectorAll('.wwqStoryLine');
    [500,1900,4000,6400,8900].forEach((delay,index)=>{
      wwqStoryTasks.push(wwqGameDelay(()=>{
        if(!stage.isConnected)return;

      if(!stage.isConnected)return;

  const background=stage.querySelector('.wwqStoryBg');
  const backgroundReady=new Promise(resolve=>{
    if(background.complete)resolve();
    else{background.addEventListener('load',resolve,{once:true});background.addEventListener('error',resolve,{once:true});}
  });
  const fontReady=document.fonts?document.fonts.load('500 16px "WWQ Story Sans"').catch(()=>[]):Promise.resolve();
  Promise.all([backgroundReady,fontReady]).then(()=>{reveal();wwqPrepareOpeningBuffer();});
}
function wwqBeginOpening(){
  const button=document.getElementById('wwqStoryBegin');
  if(!button||button.disabled||wwqResponsiveBlocked)return;
  button.disabled=true;wwqClearStoryTasks();bootOpening(true);
}
function bootOpening(autoStart=false){
  wwqPrepareVideo();
  if(!document.getElementById('wwqRotate')){
    const d=document.createElement('div');
    d.id='wwqRotate';
    d.textContent='請將手機旋轉為橫向模式';
    document.body.appendChild(d);
  }
  G.innerHTML=`<div class="wwqOfficial"><div class="wwqFrame wwqOpeningReveal" style="background:#000">
    <video id="wwqOpening" class="wwqVideo16" playsinline preload="none"></video>
    <button id="wwqSoundGate" class="wwqSoundGate">CLICK / TAP TO START</button>
    <button id="wwqSkip" class="wwqSkip16">SKIP ▶</button>
  </div></div>`;
  const placeholder=document.getElementById('wwqOpening');
  const v=wwqGetOpeningVideo();placeholder.replaceWith(v);
  const gate=document.getElementById('wwqSoundGate');
  let left=false;
  const go=()=>{if(left||document.getElementById('wwqOpening')!==v)return;left=true;v.pause();start()};
  document.getElementById('wwqSkip').onclick=go;
  v.addEventListener('ended',go,{once:true});v.addEventListener('error',go,{once:true});
  const playOpening=()=>{
    gate.style.display='none';
    v.currentTime=0;
    v.muted=false;
    v.play().catch(()=>{if(!left&&document.getElementById('wwqOpening')===v)gate.style.display='block'});
  };
  gate.onclick=playOpening;
  if(autoStart)playOpening();
}
// R57: bounded, low-priority warming of only the next screens; no visual/gameplay changes.
const wwqWarmSeen=new Set(),wwqWarmQueue=[];
let wwqWarmActive=0,wwqOpeningVideo=null;
function wwqGetOpeningVideo(){
  if(!wwqOpeningVideo){
    const video=document.createElement('video');video.id='wwqOpening';video.className='wwqVideo16';
    video.playsInline=true;video.preload='metadata';video.src='assets/video/NEW_OPENING.mp4';
    wwqOpeningVideo=video;
  }
  return wwqOpeningVideo;
}
function wwqPrepareOpeningBuffer(){
  const video=wwqGetOpeningVideo();
  if(!navigator.connection?.saveData&&!/^(slow-)?2g$/.test(navigator.connection?.effectiveType||'')){
    video.preload='auto';video.load();
  }
}
function wwqWarmImages(paths){
  if(navigator.connection?.saveData)return;
  for(const path of paths){if(path&&!wwqWarmSeen.has(path)){wwqWarmSeen.add(path);wwqWarmQueue.push(path);}}
  const pump=()=>{
    if(wwqWarmActive||!wwqWarmQueue.length||document.hidden)return;
    const path=wwqWarmQueue.shift(),image=new Image();wwqWarmActive++;
    image.fetchPriority='low';
    const done=failed=>{image.onload=image.onerror=null;wwqWarmActive--;if(failed)wwqWarmSeen.delete(path);pump();};
    image.onload=()=>done(false);image.onerror=()=>done(true);image.src=path;
  };
  if(window.requestIdleCallback)requestIdleCallback(pump,{timeout:1200});else setTimeout(pump,120);
}
function wwqWarmMode(ch,mode){
  const names=[['spell_intro.png','spell_game.png'],['picture_intro.png','picture_game.png'],['word_meaning_intro_template.png','word_meaning_game_template.png'],['meaning_word_intro_template.png','meaning_word_game_template.png'],['sentence_intro_template.png','sentence_game_template.png'],['word_attack_intro.png','word_attack_watch.png','word_attack_question.png']];
  wwqWarmImages([wwqStageBg(ch,mode),...names[mode].map(name=>'assets/ch1_ui/'+name)]);
}
function wwqPlanWarm(root){
  if(!root.isConnected)return;
  if(root.querySelector('.wwqStoryStage'))wwqWarmImages(['assets/ui/V15-UI-13_START_SCREEN_1920x1080.png?v=R25']);
  else if(root.querySelector('.wwqStartStage17'))wwqWarmImages(['assets/ui17/UI14_SCHOOL_BG.png','assets/ui17/UI14_USER_LOCKED_PANEL.png','assets/ui17/BOY.gif?v=1001','assets/ui17/GIRL.gif?v=1001']);
  else if(root.querySelector('.wwqHub17'))wwqWarmImages(['assets/world_map/WWQ_WORLD_MAP_BG_FINAL.gif','assets/ui17/WWQ_GAME_GUIDE_PANEL.png?v=1001','assets/ui17/HENRY.gif?v=R22']);
  else if(root.querySelector('.wwqMapStage')){
    const ch=wwqMapCurrentTarget();if(Number.isInteger(ch))wwqWarmImages(['assets/stage_select/bg/'+WWQ_STAGE_BG[ch],...Array.from({length:6},(_,m)=>wwqThumb(ch,m))]);
  }else if(root.querySelector('.wwqChIntro17,.wwqChStage17')){
    const next=[0,1,2,3,4,5].find(m=>!isModeComplete(currentCh,m))??5;
    wwqWarmMode(currentCh,next);if(next<5)wwqWarmMode(currentCh,next+1);
  }else if(root.querySelector('.wwqTIntro')){
    const modes=['spell_intro','picture_intro','word_meaning_intro','meaning_word_intro','sentence_intro','word_attack_intro'];
    const path=root.querySelector('.wwqTOverlay')?.getAttribute('src')||'';
    const mode=modes.findIndex(name=>path.includes(name));if(mode>=0)wwqWarmMode(currentCh,mode);
    if(mode===1)wwqWarmImages(order.slice(qIndex,qIndex+2).map(i=>wwqPicturePath(CH[currentCh].words[i][0])));
  }else if(root.querySelector('.wwqTPicture')){
    wwqWarmImages(order.slice(qIndex+1,qIndex+3).map(i=>wwqPicturePath(CH[currentCh].words[i][0])));
  }
}
function wwqInstallWarmPlanner(){
  let planned=null;
  new MutationObserver(records=>{
    if(!records.some(record=>Array.from(record.addedNodes).some(node=>node.nodeType===1)))return;
    const root=G.firstElementChild;if(!root||root===planned)return;planned=root;
    const ready=Array.from(root.querySelectorAll('img')).map(image=>image.complete?Promise.resolve():new Promise(resolve=>{
      image.addEventListener('load',resolve,{once:true});image.addEventListener('error',resolve,{once:true});
    }));
    Promise.all(ready).then(()=>wwqPlanWarm(root));
  }).observe(G,{subtree:true,childList:true});
}
wwqInstallWarmPlanner();
wwqInstallResponsive();
bootStory();
